events { worker_connections 1024; }

http {
    # Налаштуємо логування, щоб бачити, куди саме йдуть запити
    log_format proxy '[Nginx] $remote_addr - $request -> проксі на: $proxy_host';
    access_log /dev/stdout proxy;

    server {
        # Cloud Run передає порт у змінну оточення, але за дефолтом слухає 8080
        listen 8080;
        server_name localhost;

        location /api/ {
            # 1. Вказуємо реальну адресу нашого Cloud Run Java-бекенду (БЕЗ косої риски в кінці!)
            proxy_pass https://java-backend-api-3eeebkkirq-ey.a.run.app;

            # 2. Передаємо точний Host бекенду (обов'язково для маршрутизації GCP)
            proxy_set_header Host java-backend-api-3eeebkkirq-ey.a.run.app;

            # 3. Вмикаємо SNI для HTTPS з'єднання між Nginx та Java
            proxy_ssl_server_name on;

            # Інші стандартні заголовки для проксі
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Статус-роут самого Nginx (для перевірки, що проксі живий)
        location / {
            return 200 '{"status": "Proxy is running, backend is connected!"}';
            add_header Content-Type application/json;
        }
    }
}
