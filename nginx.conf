events { worker_connections 1024; }

http {
    server {
        # Cloud Run вимагає, щоб контейнер слухав порт, який передається в змінній $PORT (за замовчуванням 8080)
        listen 8080;
        server_name localhost;

        location /api/ {
            # Тимчасова адреса, поки ми не підставимо справжній Java-бекенд
            proxy_pass http://localhost:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Додамо простий статус-роут для перевірки самого Nginx
        location / {
            return 200 '{"status": "Proxy is running, waiting for backend connection"}';
            add_header Content-Type application/json;
        }
    }
}
